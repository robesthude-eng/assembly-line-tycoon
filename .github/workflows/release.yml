name: Release

# Сборка подписанного релиза.
#
# Запуск: пуш тега вида v0.2.0 либо кнопка Run workflow (тогда версия берётся
# из version.properties, а номер сборки — из счётчика прогонов).
#
# Требуемые секреты репозитория (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    — файл .jks, закодированный base64
#   KEYSTORE_PASSWORD  — пароль хранилища
#   KEY_ALIAS          — алиас ключа
#   KEY_PASSWORD       — пароль ключа

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Что повысить перед сборкой'
        required: true
        default: 'build'
        type: choice
        options: [ build, patch, minor, major ]

permissions:
  contents: write

jobs:
  release:
    name: Подписанный APK и AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
        with:
          # Полная история нужна, чтобы коммит с повышением версии лёг в ветку.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Gradle с кэшем
        uses: gradle/actions/setup-gradle@v4

      - name: Повысить версию
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "${{ inputs.bump }}" in
            major) ./gradlew bumpMajor ;;
            minor) ./gradlew bumpMinor ;;
            patch) ./gradlew bumpPatch ;;
            *)     ./gradlew bumpBuild ;;
          esac

      - name: Восстановить keystore из секрета
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Секрет KEYSTORE_BASE64 не задан — подписать релиз нечем"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Юнит-тесты
        run: ./gradlew :app:testReleaseUnitTest

      - name: Собрать подписанный APK и AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Проверить подпись и версию
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::Подписанный APK не собран — проверьте секреты подписи"
            exit 1
          fi
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | head -2
          echo "VERSION_NAME=$(grep -oP 'versionName=.\K[0-9.]+' <("$BUILD_TOOLS/aapt2" dump badging "$APK"))" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(grep -oP "versionCode='\K[0-9]+" <("$BUILD_TOOLS/aapt2" dump badging "$APK"))" >> "$GITHUB_ENV"

      - name: Зафиксировать повышенную версию в репозитории
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git diff --cached --quiet || git commit -m "Версия ${{ env.VERSION_NAME }} (код ${{ env.VERSION_CODE }})"
          git push origin HEAD:${{ github.ref_name }}

      - name: APK для установки на устройство
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: AAB для загрузки в RuStore
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Опубликовать GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }})
          body: |
            Подписанная сборка ${{ env.VERSION_NAME }}, versionCode ${{ env.VERSION_CODE }}.

            APK ставится поверх предыдущей версии: applicationId и ключ подписи те же.
            AAB — файл для загрузки в консоль RuStore.
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
