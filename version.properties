# Версия приложения. Единственное место, где она задаётся.
#
# VERSION_NAME — то, что видит игрок в RuStore: мажор.минор.патч.
# VERSION_BUILD — счётчик сборок. В CI он подменяется номером прогона
#   (GITHUB_RUN_NUMBER), поэтому versionCode растёт сам и каждая сборка
#   устанавливается поверх предыдущей.
#
# Меняется задачами ./gradlew bumpPatch | bumpMinor | bumpMajor | bumpBuild —
# править руками не нужно.
VERSION_MAJOR=0
VERSION_MINOR=1
VERSION_PATCH=1
VERSION_BUILD=1
